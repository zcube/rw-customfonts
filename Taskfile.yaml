version: "3"

dotenv: [".env"]

env:
  STEAM_OS: '{{if eq OS "windows"}}RimWorldWin64_Data{{else}}{{if eq OS "linux"}}RimWorldLinux_Data{{else}}RimWorldMac.app/Contents/Resources/Data{{end}}{{end}}'

vars:
  DOTNET: '{{default "dotnet" .DOTNET}}'

tasks:
  prepare:
    desc: download the Harmony reference assemblies into packages/ (needs curl and 7zip)
    cmds:
      # -f makes curl fail on an HTTP error instead of saving the error page as a zip, and the
      # old extract is removed first so a file dropped by a newer HarmonyMod cannot linger.
      - cmd: |
          curl -fL --retry 3 -o HarmonyMod.zip https://github.com/pardeike/HarmonyRimWorld/releases/latest/download/HarmonyMod.zip
          if [ ! -s HarmonyMod.zip ]; then
            echo "ERROR: HarmonyMod.zip was not downloaded" >&2
            exit 1
          fi
          rm -rf packages/HarmonyMod
      - cmd: 7z x -y HarmonyMod.zip -opackages
        platforms: [windows, linux]
      - cmd: 7zz x -y HarmonyMod.zip -opackages
        platforms: [darwin]
      - cmd: |
          if [ ! -f packages/HarmonyMod/1.6/Assemblies/0Harmony.dll ] && [ ! -f packages/HarmonyMod/Current/Assemblies/0Harmony.dll ]; then
            echo "ERROR: Harmony 1.6 reference is missing after extraction" >&2
            exit 1
          fi
          if [ ! -f packages/HarmonyMod/1.7/Assemblies/0Harmony.dll ]; then
            echo "ERROR: Harmony 1.7 reference is missing after extraction" >&2
            exit 1
          fi
          echo "Harmony reference assemblies ready in packages/HarmonyMod"

  build:
    desc: build every supported RimWorld version
    env:
      ProjectDir: "{{.USER_WORKING_DIR}}/Source/CustomFonts"
    cmds:
      - task: font_catalog
      # Each version compiles against its own RimWorld install. An unset or wrong STEAM_APPS_*
      # used to surface as a wall of CS0246 "type not found" errors, so the path is checked
      # up front and reported by name instead.
      - cmd: |
          build_one() {
            label="$1"
            varname="$2"
            root="$3"
            if [ -z "${root}" ]; then
              echo "ERROR: ${varname} is not set - add it to .env (see .env.sample)" >&2
              exit 1
            fi
            managed="${root}/common/RimWorld/${STEAM_OS}/Managed"
            if [ ! -f "${managed}/Assembly-CSharp.dll" ]; then
              echo "ERROR: ${varname}=${root} is not a RimWorld install" >&2
              echo "       expected ${managed}/Assembly-CSharp.dll" >&2
              exit 1
            fi
            echo "==> Release ${label}  (${root})"
            export STEAM_APPS="${root}"
            "{{.DOTNET}}" build ./Source/CustomFonts/CustomFonts.sln -c "Release ${label}"
          }
          build_one 1.4 STEAM_APPS_1_4 "${STEAM_APPS_1_4}"
          build_one 1.5 STEAM_APPS_1_5 "${STEAM_APPS_1_5}"
          build_one 1.6 STEAM_APPS_1_6 "${STEAM_APPS_1_6}"
      - task: build_waylith

  build_unity:
    desc: build one Unity version (task build_unity VERSION=1.6 STEAM_APPS=...)
    requires:
      vars: [VERSION, STEAM_APPS]
    cmds:
      - '"{{.DOTNET}}" build ./Source/CustomFonts/CustomFonts.csproj -c "Release {{.VERSION}}" -p:STEAM_APPS="{{.STEAM_APPS}}" -p:RequestedEngine=Unity'

  build_version:
    desc: build one version with automatic engine selection (below 1.7 Unity, 1.7 and above Waylith)
    requires:
      vars: [VERSION, STEAM_APPS]
    cmds:
      - '"{{.DOTNET}}" build ./Source/CustomFonts/CustomFonts.csproj -c "Release {{.VERSION}}" -p:STEAM_APPS="{{.STEAM_APPS}}" -p:GameDir="{{.STEAM_APPS}}/common/RimWorld"'

  build_waylith:
    desc: build a Waylith version (1.7 and above, requires .NET 10 SDK)
    vars:
      VERSION: '{{default "1.7" .VERSION}}'
      ROOT: '{{default .STEAM_APPS .STEAM_APPS_1_7}}'
    preconditions:
      - sh: 'test -f "{{.ROOT}}/common/RimWorld/UnityStubs.dll" || test -f "{{.ROOT}}/common/RimWorld/RimWorld.app/Contents/MacOS/UnityStubs.dll"'
        msg: STEAM_APPS_1_7 (or STEAM_APPS) must point to the Steam apps folder containing RimWorld 1.7.
      - sh: 'test -f packages/HarmonyMod/1.7/Assemblies/0Harmony.dll'
        msg: Run task prepare to install the Harmony 1.7 reference.
    cmds:
      - '"{{.DOTNET}}" build ./Source/CustomFonts/CustomFonts.csproj -c "Release {{.VERSION}}" -p:GameDir="{{.ROOT}}/common/RimWorld" -p:RequestedEngine=Waylith'

  test:
    desc: test shared font sources, Unity font imports and Waylith metadata (requires .NET 10 SDK)
    cmds:
      - '"{{.DOTNET}}" run --project Tests/WaylithFonts.Tests/WaylithFonts.Tests.csproj -- Fonts'

  benchmark:
    desc: measure loose-font startup reads and OS name caching on this machine
    cmds:
      - '"{{.DOTNET}}" run --project Tests/WaylithFonts.Tests/WaylithFonts.Tests.csproj -- --benchmark Fonts'

  font_catalog:
    desc: verify original font files, selection metadata and individual license notices
    cmds:
      - '"{{.DOTNET}}" run --project Tests/WaylithFonts.Tests/WaylithFonts.Tests.csproj -- --validate-fonts Fonts'

  export:
    desc: copy the built assemblies and mod metadata into the local Mods folder
    cmds:
      # Also copy assets/notices so exporting to a fresh test install is self-contained.
      - cmd: |
          copy_dir() {
            code=0
            robocopy "$1" "$2" /E /NFL /NDL /NJH /NJS || code=$?
            # robocopy reports 0-7 for success (bit flags) and 8 or above for real failures.
            if [ "${code}" -ge 8 ]; then
              echo "robocopy failed with exit code ${code} while copying $1" >&2
              exit "${code}"
            fi
          }
          DEST="{{.STEAM_APPS}}/common/RimWorld/Mods/rw-customfonts"
          copy_dir 1.4/Assemblies "${DEST}/1.4/Assemblies"
          copy_dir 1.5/Assemblies "${DEST}/1.5/Assemblies"
          copy_dir 1.6/Assemblies "${DEST}/1.6/Assemblies"
          copy_dir 1.7/Assemblies "${DEST}/1.7/Assemblies"
          copy_dir Languages "${DEST}/Languages"
          copy_dir About "${DEST}/About"
          copy_dir Fonts "${DEST}/Fonts"
          code=0
          robocopy . "${DEST}" LICENSE README.md /NFL /NDL /NJH /NJS || code=$?
          if [ "${code}" -ge 8 ]; then exit "${code}"; fi
          echo "Exported to ${DEST}"
        platforms: [windows]
      - cmd: |
          DEST="{{.STEAM_APPS}}/common/RimWorld/Mods/rw-customfonts"
          mkdir -p "${DEST}/1.4/Assemblies" "${DEST}/1.5/Assemblies" "${DEST}/1.6/Assemblies" "${DEST}/Languages" "${DEST}/About"
          cp -rf 1.4/Assemblies/. "${DEST}/1.4/Assemblies/"
          cp -rf 1.5/Assemblies/. "${DEST}/1.5/Assemblies/"
          cp -rf 1.6/Assemblies/. "${DEST}/1.6/Assemblies/"
          mkdir -p "${DEST}/1.7/Assemblies"
          cp -rf 1.7/Assemblies/. "${DEST}/1.7/Assemblies/"
          cp -rf Languages/. "${DEST}/Languages/"
          cp -rf About/. "${DEST}/About/"
          mkdir -p "${DEST}/Fonts"
          cp -rf Fonts/. "${DEST}/Fonts/"
          cp -f LICENSE README.md "${DEST}/"
          echo "Exported to ${DEST}"
        platforms: [linux]
      - cmd: |
          DEST="{{.STEAM_APPS}}/common/RimWorld/RimWorldMac.app/Mods/rw-customfonts"
          mkdir -p "${DEST}/1.4/Assemblies" "${DEST}/1.5/Assemblies" "${DEST}/1.6/Assemblies" "${DEST}/Languages" "${DEST}/About"
          cp -rf 1.4/Assemblies/. "${DEST}/1.4/Assemblies/"
          cp -rf 1.5/Assemblies/. "${DEST}/1.5/Assemblies/"
          cp -rf 1.6/Assemblies/. "${DEST}/1.6/Assemblies/"
          mkdir -p "${DEST}/1.7/Assemblies"
          cp -rf 1.7/Assemblies/. "${DEST}/1.7/Assemblies/"
          cp -rf Languages/. "${DEST}/Languages/"
          cp -rf About/. "${DEST}/About/"
          mkdir -p "${DEST}/Fonts"
          cp -rf Fonts/. "${DEST}/Fonts/"
          cp -f LICENSE README.md "${DEST}/"
          echo "Exported to ${DEST}"
        platforms: [darwin]
      - task: remove_legacy_fonts
        vars:
          MOD_ROOT: '{{.STEAM_APPS}}/common/RimWorld/{{if eq OS "darwin"}}RimWorldMac.app/{{end}}Mods/rw-customfonts'

  remove_legacy_fonts:
    internal: true
    requires:
      vars: [MOD_ROOT]
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '$modRoot = [IO.Path]::GetFullPath("{{.MOD_ROOT}}");
          if ([IO.Path]::GetFileName($modRoot) -ne "rw-customfonts" -or [IO.Path]::GetFileName([IO.Path]::GetDirectoryName($modRoot)) -ne "Mods") { throw "Unexpected mod export directory" };
          foreach ($relative in @("rimfonts", "About/AssetsTools.NET-LICENSE.txt", "Assemblies/AssetsTools.NET.dll", "1.4/Assemblies/AssetsTools.NET.dll", "1.5/Assemblies/AssetsTools.NET.dll", "1.6/Assemblies/AssetsTools.NET.dll", "1.7/Assemblies/AssetsTools.NET.dll")) {
          $file = Join-Path $modRoot $relative; if (Test-Path -LiteralPath $file -PathType Leaf) { Remove-Item -LiteralPath $file -Force } }'
        platforms: [windows]
      - cmd: |
          DEST="{{.MOD_ROOT}}"
          case "${DEST}" in /*/Mods/rw-customfonts) ;; *) echo "Unexpected mod export directory" >&2; exit 1;; esac
          rm -f "${DEST}/rimfonts" "${DEST}/About/AssetsTools.NET-LICENSE.txt" "${DEST}/Assemblies/AssetsTools.NET.dll"
          for version in 1.4 1.5 1.6 1.7; do rm -f "${DEST}/${version}/Assemblies/AssetsTools.NET.dll"; done
        platforms: [linux, darwin]

  build_and_export:
    desc: build and export the project
    cmds:
      - task: build
      - task: export

  package:
    desc: package committed runtime files and font notices (requires a clean tree)
    cmds:
      - task: font_catalog
      - cmd: |
          if ! git diff --quiet HEAD --; then
            echo "ERROR: commit tracked changes before packaging HEAD." >&2
            exit 1
          fi
      - git archive --format=zip HEAD -o custom-fonts.zip -- 1.4 1.5 1.6 1.7 About Fonts Languages LICENSE README.md
      # Replace archived LFS pointers with real DLLs and fonts from the checkout.
      # Use only tracked runtime paths, excluding local extras.
      - git -c core.quotepath=false ls-files 1.4 1.5 1.6 1.7 Fonts > custom-fonts-files.txt
      - cmd: 7z a -y custom-fonts.zip @custom-fonts-files.txt
        platforms: [windows, linux]
      - cmd: 7zz a -y custom-fonts.zip @custom-fonts-files.txt
        platforms: [darwin]
      - rm -f custom-fonts-files.txt
      - cmd: >-
          powershell -NoProfile -Command '$ErrorActionPreference = "Stop"; $path = [IO.Path]::GetFullPath("custom-fonts.zip");
          $sha = [Security.Cryptography.SHA256]::Create(); $stream = [IO.File]::OpenRead($path);
          try { $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant();
          [IO.File]::WriteAllText($path + ".sha256", $hash + "  custom-fonts.zip" + [Environment]::NewLine) }
          finally { $stream.Dispose(); $sha.Dispose() }'
        platforms: [windows]
      - cmd: sha256sum custom-fonts.zip > custom-fonts.zip.sha256
        platforms: [linux]
      - cmd: shasum -a 256 custom-fonts.zip > custom-fonts.zip.sha256
        platforms: [darwin]

  release:
    desc: install the committed tree into the local Mods folder as players would get it
    cmds:
      - task: package
      - cmd: |
          DEST="{{.STEAM_APPS}}/common/RimWorld/Mods/rw-customfonts"
          mkdir -p "${DEST}"
          7z x -y custom-fonts.zip -o"${DEST}"
          echo "Released to ${DEST}"
        platforms: [windows, linux]
      - cmd: |
          DEST="{{.STEAM_APPS}}/common/RimWorld/RimWorldMac.app/Mods/rw-customfonts"
          mkdir -p "${DEST}"
          7zz x -y custom-fonts.zip -o"${DEST}"
          echo "Released to ${DEST}"
        platforms: [darwin]
      - task: remove_legacy_fonts
        vars:
          MOD_ROOT: '{{.STEAM_APPS}}/common/RimWorld/{{if eq OS "darwin"}}RimWorldMac.app/{{end}}Mods/rw-customfonts'


  clean:
    desc: remove build outputs and downloaded archives
    cmds:
      - cmd: |
          rm -rf Source/CustomFonts/obj Source/CustomFonts/bin
          rm -f 1.4/Assemblies/CustomFonts.dll 1.5/Assemblies/CustomFonts.dll 1.6/Assemblies/CustomFonts.dll 1.7/Assemblies/CustomFonts.dll
          rm -f custom-fonts.tar.gz custom-fonts.zip HarmonyMod.zip
          echo "Cleaned"

  rider:
    desc: open the project in Rider
    cmds:
      - rider .

  code:
    desc: open the project in VS Code
    cmds:
      - code .

  format:
    desc: format the source with dotnet format
    cmds:
      - dotnet format ./Source/CustomFonts/CustomFonts.sln

  version:
    desc: get current version
    cmds:
      # Version.txt holds "<version> rev<n>". read and parameter expansion are shell builtins,
      # so this needs no monodis, no PowerShell and no tr/grep/sed on any platform. The trailing
      # CR of the CRLF file sits after the rev, so cutting at the first space also drops it.
      - cmd: |
          read -r RIMWORLD_VERSION_LINE < "${STEAM_APPS}/common/RimWorld/Version.txt" || RIMWORLD_VERSION_LINE=""
          echo "Current version: ${RIMWORLD_VERSION_LINE%% *}"

  backup:
    desc: backup the installed version into old/RimWorld/<version>
    cmds:
      - cmd: |
          read -r RIMWORLD_VERSION_LINE < "${STEAM_APPS}/common/RimWorld/Version.txt" || RIMWORLD_VERSION_LINE=""
          CURRENT_VERSION=${RIMWORLD_VERSION_LINE%% *}
          if [ -z "${CURRENT_VERSION}" ]; then
            echo "ERROR: could not read a version from ${STEAM_APPS}/common/RimWorld/Version.txt" >&2
            echo "Refusing to mirror into an unnamed backup folder." >&2
            exit 1
          fi
          DEST="${STEAM_APPS}/old/RimWorld/${CURRENT_VERSION}/common/RimWorld"
          echo "Backing up ${CURRENT_VERSION} -> ${DEST}"
          mkdir -p "${DEST}"
          rsync -a --delete "${STEAM_APPS}/common/RimWorld/" "${DEST}/"
          echo "Backup complete"
        platforms: [linux, darwin]
      - cmd: |
          read -r RIMWORLD_VERSION_LINE < "${STEAM_APPS}/common/RimWorld/Version.txt" || RIMWORLD_VERSION_LINE=""
          CURRENT_VERSION=${RIMWORLD_VERSION_LINE%% *}
          if [ -z "${CURRENT_VERSION}" ]; then
            echo "ERROR: could not read a version from ${STEAM_APPS}/common/RimWorld/Version.txt" >&2
            echo "Refusing to mirror into an unnamed backup folder." >&2
            exit 1
          fi
          DEST="${STEAM_APPS}/old/RimWorld/${CURRENT_VERSION}/common/RimWorld"
          echo "Backing up ${CURRENT_VERSION} -> ${DEST}"
          # robocopy creates the destination tree itself, so no mkdir is needed here - handy
          # because a bare Windows box has no mkdir binary for Task's built in shell.
          code=0
          robocopy "${STEAM_APPS}/common/RimWorld" "${DEST}" /MIR /NFL /NDL /NJH /NJS || code=$?
          # robocopy reports 0-7 for success (bit flags) and 8 or above for real failures.
          if [ "${code}" -ge 8 ]; then
            echo "robocopy failed with exit code ${code}" >&2
            exit "${code}"
          fi
          echo "Backup complete"
        platforms: [windows]
